[pytest]
; 测试临时目录保留策略：默认（all）会把每轮的 tmp 目录留在 %TEMP%\pytest-of-<user>\ 下，
; 攒够几轮之后一次清理会有上千个文件——碰到带「批量删除守卫」的环境（本机就有：
; shutil.rmtree 超过 50 个文件抛 BaseException），pytest 会在退出阶段被这个守卫打断：
; 测试全绿、退出码却是 1，于是「绿」和「红」在自动化里分不开（2026-11-03 实测）。
;
; `none` = 每个用例结束就删自己的临时目录（单目录文件数少，不触发批量阈值），
; 从根上不让垃圾堆积。注意它**不是**「不清理」，而是「及时清理」。
tmp_path_retention_policy = none
